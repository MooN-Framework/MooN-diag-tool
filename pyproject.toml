[project]
name = "diag-tool"
version = "0.1.0"
description = "Diagnose-GUI für das 2oo3-Voting-Framework"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "tomli>=2.0; python_version<'3.11'",
    "pytest>=7",
]

[project.scripts]
diag-tool = "diag_tool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diag_tool"]
