[project]
name = "diag-tool"
version = "0.1.0"
description = "Diagnostic GUI and test framework for the 2oo3 voting system"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
	"pytest>=7",
]
# System dependencies NOT covered by this file (not pip-installable):
#   sshpass  -- required for any hardware-mode SSH/SCP action (deploy,
#               start/stop, log fetch, node probe). `apt install sshpass`.
#   cross    -- only if cross-compiling (Timing tab "Target triple" set
#               to something other than the host). `cargo install cross
#               --locked`, plus Docker or Podman running. See README.md.

[project.scripts]
diag-tool = "diag_tool.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Two top-level packages: the GUI (diag_tool) and the reusable test
# harness (harness). Tests under tests/ import the latter directly.
packages = ["src/diag_tool", "src/harness"]
