[project]
name = "diag-tool"
version = "0.1.0"
description = "Diagnosetool für das 2oo3-Voting-System (ETCS Bremskurve)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tomli-w>=1.0",
]

[project.scripts]
diag-tool = "diag_tool.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diag_tool"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true
