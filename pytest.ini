[pytest]
# Test discovery lives under tests/ (scenarios + timing_analysis).
testpaths = tests
python_files = test_*.py *_test.py
addopts = -v --tb=short --strict-markers
markers =
    slow: langsam, per default nicht ausgefuehrt (>30s)
    timing: langlaufende Timing-Studie, nur mit `pytest -m timing` aktiv
# Damit `from harness.xxx import ...` in Tests funktioniert.
pythonpath = src
