[pytest]
# Test discovery lives under tests/ (scenarios + timing_analysis).
testpaths = tests
python_files = test_*.py *_test.py
# -m "not timing" keeps the timing study out of a normal catalog run.
# A command-line -m overrides this one, so `pytest -m timing` still
# selects it. Without this, `testpaths = tests` pulled the sweep into
# every plain `pytest` invocation, contradicting its own marker.
addopts = -v --tb=short --strict-markers -m "not timing"
markers =
    slow: slow test (>30s). NOT deselected automatically -- it runs as
        part of a normal catalog run. Exclude it explicitly with
        `pytest -m "not slow"` when a fast run is wanted.
    timing: long-running timing study, only active with `pytest -m timing`
# Required so `from harness.xxx import ...` works inside the tests.
pythonpath = src
